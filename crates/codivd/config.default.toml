# Codiv — Configuration
#
# This file controls permissions, LLM providers, and model assignments.
# Edit the values below to customize behavior.

# ── Models ──────────────────────────────────────────────────────────
# The provider used when a role doesn't specify one.
# Supported: "anthropic", "openai", "google", or any OpenAI-compatible provider name
default_provider = "anthropic"

# The model used when a role doesn't specify one.
default_model = "claude-sonnet-4-5"

# ── Permissions ─────────────────────────────────────────────────────
[permissions]
mode = "auto"  # "auto" | "manual" | "bypass"
# allow = ["bash:cargo build", "bash:git log", "bash:git status"]
# deny = ["bash:rm -rf"]

# ── Provider-level settings ──────────────────────────────────────────
# API keys and base URLs set here apply to all roles using that provider.
# Per-role settings (below) take precedence over these.
#
# [providers.anthropic]
# api_key = "sk-ant-..."          # or set ANTHROPIC_API_KEY env var
# base_url = "https://custom-endpoint.example.com"  # /v1 is auto-appended if missing
#
# [providers.openai]
# api_key = "sk-..."              # or set OPENAI_API_KEY env var
#
# [providers.google]
# api_key = "..."                 # or set GOOGLE_API_KEY env var
#
# ── Custom OpenAI-compatible providers ─────────────────────────────
# Any provider name other than "anthropic", "openai", or "google" is
# treated as an OpenAI-compatible endpoint. Both api_key and base_url
# are required for custom providers.
#
# [providers.deepseek]
# api_key = "sk-..."
# base_url = "https://api.deepseek.com"
#
# [providers.groq]
# api_key = "gsk_..."
# base_url = "https://api.groq.com/openai"
#
# [providers.ollama]
# api_key = "ollama"              # ollama doesn't need a real key but field is required
# base_url = "http://localhost:11434"

# ── Per-role overrides ───────────────────────────────────────────────
# Assign a specific provider/model to each agent role.
# Available roles: engineer, team_lead, reviewer, researcher, security
#
# [roles.engineer]
# provider = "anthropic"
# model = "claude-sonnet-4-5"
# temperature = 0
# api_key = "sk-ant-..."          # overrides provider-level key
# base_url = "https://..."        # overrides provider-level url

[roles.permission_evaluator]
provider = "anthropic"
model = "claude-haiku-3-5"

# Auto-generate session titles via a cheap LLM call after the first
# response.  Omit this section to keep the truncated-prompt title.
# Use a fast model that won't compete with your main inference server.
#
# [roles.session_namer]
# provider = "anthropic"
# model = "claude-haiku-3-5"
