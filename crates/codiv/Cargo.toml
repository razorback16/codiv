[package]
name = "codiv"
version.workspace = true
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
codiv-common = { path = "../codiv-common" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
nix = { version = "0.29", features = ["term", "signal", "poll", "fs"] }
portable-pty = "0.9"
libc = "0.2"
crossbeam-channel = "0.5"
dirs = "6"
rand = "0.8"
tui-term = "0.3"
vt100 = "0.16"
human_format = "1"
clap = { version = "4", features = ["derive"] }
url = "2"
codiv-tools = { path = "../codiv-tools" }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
streamdown-parser = { git = "https://github.com/razorback16/streamdown-rs" }
streamdown-render = { git = "https://github.com/razorback16/streamdown-rs" }
similar = "2"
dialoguer = { version = "0.12.0", features = ["password"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros"] }
open = "5.3.3"

[dev-dependencies]
termwright = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
