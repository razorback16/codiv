[package]
name = "slate"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
slate-common = { path = "../slate-common" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
nix = { version = "0.29", features = ["term", "signal", "poll", "fs"] }
portable-pty = "0.9"
libc = "0.2"
dirs = "6"
rand = "0.8"
tui-term = "0.3"
vt100 = "0.16"
arboard = "3"
log = "0.4"
env_logger = "0.11"
