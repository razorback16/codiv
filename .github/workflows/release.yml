name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIR="codiv-${TAG}-${{ matrix.target }}"
          mkdir "$DIR"
          cp target/${{ matrix.target }}/release/codiv target/${{ matrix.target }}/release/codivd "$DIR/"
          cp LICENSE README.md "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codiv-${{ matrix.target }}
          path: codiv-*.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum codiv-*.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            codiv-*.tar.gz
            checksums.txt

  update-formula:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update formula version, URLs, and SHA256 hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release download "$TAG" --dir tarballs

          SHA_ARM=$(sha256sum tarballs/codiv-${TAG}-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_INTEL=$(sha256sum tarballs/codiv-${TAG}-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_LINUX=$(sha256sum tarballs/codiv-${TAG}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')

          # Generate the formula from scratch with correct values
          cat > Formula/codiv.rb << RUBY
          class Codiv < Formula
            desc "Terminal-native AI coding assistant built in Rust"
            homepage "https://codiv.ai"
            version "${TAG}"
            license "GPL-3.0-only"

            on_macos do
              on_arm do
                url "https://github.com/razorback16/codiv/releases/download/${TAG}/codiv-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              end

              on_intel do
                url "https://github.com/razorback16/codiv/releases/download/${TAG}/codiv-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/razorback16/codiv/releases/download/${TAG}/codiv-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "codiv"
              bin.install "codivd"
            end

            service do
              run [opt_bin/"codivd", "--foreground"]
              keep_alive true
              working_dir var
              log_path var/"log/codivd.log"
              error_log_path var/"log/codivd.log"
              environment_variables HOME: Dir.home
            end

            def post_install
              (var/"log").mkpath
            end

            def caveats
              <<~EOS
                To start codivd as a background daemon managed by launchd:
                  brew services start codiv

                The codiv TUI will also auto-launch codivd if it's not running,
                but using brew services gives you auto-restart on crash and
                automatic startup on login.

                Logs: #{var}/log/codivd.log
                Config: ~/.codiv/config.toml
              EOS
            end

            test do
              assert_match "codiv", shell_output("#{bin}/codiv --help")
            end
          end
          RUBY

          # Fix indentation (remove leading spaces from heredoc)
          sed -i 's/^          //' Formula/codiv.rb

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codiv.rb
          git commit -m "Update Homebrew formula for ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push
