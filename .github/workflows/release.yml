name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIR="codiv-${TAG}-${{ matrix.target }}"
          mkdir "$DIR"
          cp target/${{ matrix.target }}/release/codiv target/${{ matrix.target }}/release/codivd "$DIR/"
          cp LICENSE README.md "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codiv-${{ matrix.target }}
          path: codiv-*.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: codiv-*.tar.gz

  update-formula:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update formula version, URLs, and SHA256 hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release download "$TAG" --dir tarballs

          SHA_ARM=$(sha256sum tarballs/codiv-${TAG}-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_INTEL=$(sha256sum tarballs/codiv-${TAG}-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_LINUX=$(sha256sum tarballs/codiv-${TAG}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')

          # Generate the formula from scratch with correct values
          cat > Formula/codiv.rb << RUBY
          class Codiv < Formula
            desc "Terminal-native AI coding assistant built in Rust"
            homepage "https://codiv.ai"
            version "${TAG}"
            license "GPL-3.0-only"

            on_macos do
              on_arm do
                url "https://github.com/razorback16/codiv/releases/download/${TAG}/codiv-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              end

              on_intel do
                url "https://github.com/razorback16/codiv/releases/download/${TAG}/codiv-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/razorback16/codiv/releases/download/${TAG}/codiv-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "codiv"
              bin.install "codivd"
            end

            test do
              assert_match "codiv", shell_output("#{bin}/codiv --help")
            end
          end
          RUBY

          # Fix indentation (remove leading spaces from heredoc)
          sed -i 's/^          //' Formula/codiv.rb

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codiv.rb
          git commit -m "Update Homebrew formula for ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push
