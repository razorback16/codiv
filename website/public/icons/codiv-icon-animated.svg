    <path style="fill: rgb(21,31,47)" stroke-linecap="round" d="M-17.9406-111.704C23.13-116.2617 58.1413-103.6247 71.8966-62.5223 91.6378-3.4505 86.9224 85.7046 20.7845 111.2302-82.3438 130.1086-97.7361-0.8992-66.9027-70.6895-57.0565-93.0039-40.4671-104.2015-17.9406-111.704Z"/>
