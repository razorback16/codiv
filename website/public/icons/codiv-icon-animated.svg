  <path style="fill: rgb(223,222,222)" stroke-linecap="round" d="M360.9981 255.222C394.287 271.9792 439.6112 297.0478 471.1703 316.4565 396.4297 439.7638 319.0774 581.605 247.2956 707.6641 272.4974 728.9301 308.7059 754.9469 335.315 775.0766 399.0977 822.7578 462.5042 870.9399 525.5319 919.6157L461.3778 1015.7308 457.024 1022.004C455.7169 1022.1409 454.4098 1022.2753 453.1026 1022.4121 354.3575 946.0846 173.1927 811.8339 83.722 741.1345 170.339 582.4261 269.7243 411.8018 360.9981 255.222Z"/>
