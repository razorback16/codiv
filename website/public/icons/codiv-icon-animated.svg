<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1536" height="1024" viewBox="0 0 2048 1365">
<desc>Animated CoDiv logo</desc>
<defs>
<style>
  /* 7s cycle:
     0-15%   logo state (C+D centered, o/i/v hidden)
     15-40%  expand to full "CoDiv"
     40-65%  full text hold
     65-90%  collapse back to logo
     90-100% logo state hold (seamless loop)
  */

  .letter-c {
    animation: slide-c 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes slide-c {
    0%, 15%  { transform: translate(589.278px, -119.222px); }
    40%, 65% { transform: translate(0px, 0px); }
    90%, 100% { transform: translate(589.278px, -119.222px); }
  }

  .letter-d {
    animation: slide-d 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes slide-d {
    0%, 15%  { transform: translate(38.896px, 211.897px); }
    40%, 65% { transform: translate(0px, 0px); }
    90%, 100% { transform: translate(38.896px, 211.897px); }
  }

  .letter-o {
    animation: fade-o 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    transform-origin: 714px 673px;
  }
  @keyframes fade-o {
    0%, 18%   { opacity: 0; transform: scale(0.4); }
    42%, 62%  { opacity: 1; transform: scale(1); }
    87%, 100% { opacity: 0; transform: scale(0.4); }
  }

  .letter-i {
    animation: fade-i 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes fade-i {
    0%, 22%   { opacity: 0; }
    44%, 60%  { opacity: 1; }
    82%, 100% { opacity: 0; }
  }

  .letter-v {
    animation: fade-v 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes fade-v {
    0%, 25%   { opacity: 0; }
    46%, 58%  { opacity: 1; }
    80%, 100% { opacity: 0; }
  }
</style>
</defs>

<!-- Background -->
<path style="fill: rgb(21,31,47)" d="M0 0L2048 0 2048 1365.3276 0 1365.3276 0 0Z"/>

<!-- C (left angle bracket) -->
